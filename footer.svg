      <stop offset="0" stop-color="#0366D6"/>
      <stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
  </defs>

  <path d="M0 45 q125 -35 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V100 H0 Z" fill="url(#bg)" fill-opacity="0.45">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0 60 q125 -30 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V100 H0 Z" fill="url(#bg)">
    <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
  </path>
</svg>
